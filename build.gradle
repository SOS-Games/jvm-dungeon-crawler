buildscript {
  repositories {
    mavenCentral()
    gradlePluginPortal()
  }
}

allprojects {
  apply plugin: 'eclipse'
  apply plugin: 'idea'
}

configure(subprojects) {
  apply plugin: 'java-library'
  java.sourceCompatibility = 21
  compileJava {
    options.incremental = true
    options.encoding = 'UTF-8'
  }
}

subprojects {
  version = "$projectVersion"
  ext.appName = 'jvm-dungeon-crawler'
  repositories {
    mavenCentral()
  }
}

eclipse.project.name = 'jvm-dungeon-crawler-parent'
